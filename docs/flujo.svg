<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">OMNI Guard · de la grabación al aviso</title><desc id="d">Cada etapa dice qué aporta y con qué modelo. Las cifras de velocidad están medidas en esta máquina; las de acierto vienen de la validación con la que se entrenó cada modelo.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">OMNI Guard · de la grabación al aviso</text><text x="48" y="82" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Cada etapa dice qué aporta y con qué modelo. Las cifras de velocidad están medidas en esta máquina; las de acierto</text><text x="48" y="102" font-size="14" font-weight="400" fill="#475569" text-anchor="start">vienen de la validación con la que se entrenó cada modelo.</text><rect x="60" y="150" width="360" height="900" rx="18" fill="#e2e8f0" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="76" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ENTRADA</text><text x="76" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">La cámara que ya está</text><rect x="460" y="150" width="360" height="900" rx="18" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="476" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DETECCIÓN</text><text x="476" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué hay en cada fotograma</text><rect x="860" y="150" width="340" height="900" rx="18" fill="#ede9fe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="876" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">IDENTIDAD</text><text x="876" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Quién es quién</text><rect x="1240" y="150" width="340" height="900" rx="18" fill="#dcfce7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1256" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">REGLAS</text><text x="1256" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Cuándo eso importa</text><rect x="1620" y="150" width="320" height="900" rx="18" fill="#fef3c7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1636" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DECISIÓN</text><text x="1636" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué se hace con eso</text><path d="M 400 330 H 440.0 V 330 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">fotogramas</text><path d="M 400 700 V 1010 H 1390 V 960" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830.0" y="1002" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">las zonas entran en las reglas, no en el detector</text><path d="M 800 330 H 840.0 V 400 H 880" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="840.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">cajas</text><path d="M 800 660 H 1030.0 V 880 H 1260" fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1030.0" y="650" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">recortes</text><path d="M 1180 400 H 1220.0 V 400 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1220.0" y="390" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">ID estable</text><path d="M 1560 400 H 1600.0 V 330 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 700 H 1600.0 V 560 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 880 H 1600.0 V 790 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="250" width="320" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="262" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">EXISTENTE</text><text x="96" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cámara de entrada o cochera</text><text x="96" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un .mp4 de la cámara de siempre.</text><text x="96" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Sin sensores, sin barrera nueva,</text><text x="96" y="361" font-size="11" font-weight="400" fill="#475569" text-anchor="start">sin cambiar la instalación.</text><rect x="80" y="560" width="320" height="190" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="572" width="56.800000000000004" height="20" rx="10" fill="#dbeafe"/><text x="124.4" y="586" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">UNA VEZ</text><text x="96" y="614" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Plazas y zonas vetadas</text><text x="96" y="639" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un polígono por plaza y otro por</text><text x="96" y="655" font-size="11" font-weight="400" fill="#475569" text-anchor="start">zona prohibida. Se guardan de 0</text><text x="96" y="671" font-size="11" font-weight="400" fill="#475569" text-anchor="start">a 1, así valen aunque cambie la</text><text x="96" y="687" font-size="11" font-weight="400" fill="#475569" text-anchor="start">resolución del fotograma.</text><rect x="480" y="240" width="320" height="240" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="252" width="63.2" height="20" rx="10" fill="#dcfce7"/><text x="527.6" y="266" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">DETECTOR</text><text x="496" y="294" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">YOLO11n · personas y vehículos</text><text x="496" y="319" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Rápido y suficiente para cámara</text><text x="496" y="335" font-size="11" font-weight="400" fill="#475569" text-anchor="start">fija. Entrenado sobre COCO.</text><line x1="496" y1="343" x2="784" y2="343" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="359" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50 (COCO)</text><text x="784" y="359" font-size="12" font-weight="700" fill="#166534" text-anchor="end">55.1 %</text><text x="496" y="378" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50-95</text><text x="784" y="378" font-size="12" font-weight="700" fill="#166534" text-anchor="end">39.4 %</text><text x="496" y="397" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="397" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">53.3 fps</text><text x="496" y="416" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">latencia</text><text x="784" y="416" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">18.7 ms</text><rect x="480" y="560" width="320" height="235" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="572" width="63.2" height="20" rx="10" fill="#fee2e2"/><text x="527.6" y="586" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">SENSIBLE</text><text x="496" y="614" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">face_yolov8s · rostros</text><text x="496" y="639" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Recorta la cara a partir de unos</text><text x="496" y="655" font-size="11" font-weight="400" fill="#475569" text-anchor="start">28 px. Los recortes NO se</text><text x="496" y="671" font-size="11" font-weight="400" fill="#475569" text-anchor="start">versionan: son datos biométricos</text><text x="496" y="687" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de gente que no dio permiso.</text><line x1="496" y1="695" x2="784" y2="695" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="711" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="711" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">18.2 fps</text><text x="496" y="730" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">cara mínima</text><text x="784" y="730" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">~28 px</text><text x="496" y="749" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">Ley 29733</text><text x="784" y="749" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">no se publican</text><rect x="880" y="300" width="300" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="312" width="82.4" height="20" rx="10" fill="#ede9fe"/><text x="937.2" y="326" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">SEGUIMIENTO</text><text x="896" y="354" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">ByteTrack</text><text x="896" y="379" font-size="11" font-weight="400" fill="#475569" text-anchor="start">El mismo ID entre fotogramas.</text><text x="896" y="395" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="896" y="411" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Es lo que permite decir «lleva</text><text x="896" y="427" font-size="11" font-weight="400" fill="#475569" text-anchor="start">ocho minutos ahí» en lugar de</text><text x="896" y="443" font-size="11" font-weight="400" fill="#475569" text-anchor="start">«hay alguien», que no sirve para</text><text x="896" y="459" font-size="11" font-weight="400" fill="#475569" text-anchor="start">disparar nada.</text><line x1="896" y1="467" x2="1164" y2="467" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="483" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">sin re-identificación</text><text x="1164" y="483" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">sale y vuelve = nuevo</text><rect x="1260" y="300" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="326" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Intrusión</text><text x="1276" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Entró en una zona donde no</text><text x="1276" y="367" font-size="11" font-weight="400" fill="#475569" text-anchor="start">debía estar.</text><line x1="1276" y1="375" x2="1544" y2="375" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="391" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">dispara</text><text x="1544" y="391" font-size="12" font-weight="700" fill="#166534" text-anchor="end">al instante</text><rect x="1260" y="610" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="636" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Merodeo</text><text x="1276" y="661" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Sigue dentro pasado el umbral.</text><text x="1276" y="677" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Nadie merodea en un fotograma.</text><line x1="1276" y1="685" x2="1544" y2="685" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="701" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">el umbral</text><text x="1544" y="701" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">es toda la diferencia</text><rect x="1260" y="790" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="816" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cochera: entra, ocupa, sale</text><text x="1276" y="841" font-size="11" font-weight="400" fill="#475569" text-anchor="start">El importe sale del tiempo</text><text x="1276" y="857" font-size="11" font-weight="400" fill="#475569" text-anchor="start">dentro de la plaza.</text><line x1="1276" y1="865" x2="1544" y2="865" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="881" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">tiempo</text><text x="1544" y="881" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">del video, no del reloj</text><rect x="1640" y="250" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="262" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Aviso mientras pasa</text><text x="1656" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">No a las tres horas revisando</text><text x="1656" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">la grabación.</text><rect x="1640" y="480" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="492" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="506" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="534" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cobro sin cuaderno</text><text x="1656" y="559" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Ni se discute ni se olvida.</text><text x="1656" y="575" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Queda en el CSV.</text><rect x="1640" y="710" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="722" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="736" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="764" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Quién pasó por la entrada</text><text x="1656" y="789" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Con el recorte de cara, que se</text><text x="1656" y="805" font-size="11" font-weight="400" fill="#475569" text-anchor="start">queda en la máquina.</text><rect x="48" y="1090" width="1904" height="52" rx="12" fill="#e2e8f0"/><text x="70" y="1122" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Una cámara graba. Lo que cambia el resultado es avisar mientras pasa, y cobrar sin que nadie apunte nada en un cuaderno.</text></svg>